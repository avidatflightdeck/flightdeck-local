# Cloudflare Worker configuration for the Flightdeck Stripe webhook.
#
# Two environments are defined: "sandbox" (Stripe test mode) and "live"
# (Stripe live mode). Secrets are NEVER stored here — they are set with
# `wrangler secret put <NAME> --env <sandbox|live>` and injected at runtime
# as environment bindings. This file contains no credentials.
#
# Persistence is Cloudflare D1 (not KV — D1 was already provisioned for
# this project and gives atomic dedup via PRIMARY KEY constraints, which
# KV's get/put pattern cannot guarantee under concurrent deliveries). Both
# D1 databases listed below already exist with migrations 1 and 2 applied
# (schema_migrations, stripe_events, event_deliveries) — this file binds
# to them, it does not create them. See migrations/README.md for the
# schema.

name = "flightdeck-stripe-webhook"
main = "src/index.js"
compatibility_date = "2026-01-01"

# --- Sandbox (Stripe TEST mode) ---
[env.sandbox]
name = "flightdeck-stripe-webhook-sandbox"
d1_databases = [
  { binding = "DB", database_name = "flightdeck-stripe-webhook-sandbox", database_id = "3a2a1c7c-d83c-4f9c-bbcc-d7e59f96e71f" }
]
vars = { STRIPE_MODE = "sandbox", APP_ENV = "sandbox" }

[[env.sandbox.triggers]]
crons = ["*/5 * * * *"]

# --- Live (Stripe LIVE mode) ---
# NOT deployed by this package run. Bound here for when the owner
# explicitly authorizes live deployment, after sandbox testing passes.
[env.live]
name = "flightdeck-stripe-webhook-live"
d1_databases = [
  { binding = "DB", database_name = "flightdeck-stripe-webhook-live", database_id = "82fe9d5b-7f0e-4d97-8ae6-2be9fc4d73a5" }
]
vars = { STRIPE_MODE = "live", APP_ENV = "live" }

# Live Cron Trigger intentionally omitted here until live deployment is
# authorized; add the same `[[env.live.triggers]] crons = [...]` block at
# that time if an equivalent retry sweep is wanted in live.

# Secrets required per environment (set via `wrangler secret put`, never
# written to this file, source control, or logs):
#   STRIPE_WEBHOOK_SECRET   - whsec_... signing secret for that endpoint
#   STRIPE_SECRET_KEY       - sk_test_... (sandbox) or sk_live_... (live)
#   NOTIFY_WEBHOOK_URL      - internal notification endpoint (Flightdeck ops)
#   ACK_EMAIL_API_KEY       - credential for the transactional email provider
#                             used to send the customer acknowledgment
